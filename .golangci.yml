run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - typecheck    # BẮT BUỘC: Để linter phân tích được AST của Go
    - gocyclo      # Kiểm tra Cyclomatic Complexity
    - gocognit     # Kiểm tra Cognitive Complexity
    - cyclop       # Giới hạn độ phức tạp của hàm
    - funlen       # Giới hạn độ dài hàm
    - goconst      # Phát hiện chuỗi lặp lại
    - nestif       # Kiểm tra IF lồng nhau

linters-settings:
  gocyclo:
    min-complexity: 10

  gocognit:
    min-complexity: 15

  cyclop:
    max-complexity: 10
    package-average: 5.0

  funlen:
    lines: 60
    statements: 40

  nestif:
    min-complexity: 3

  goconst:
    min-len: 3
    min-occurrences: 3

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0