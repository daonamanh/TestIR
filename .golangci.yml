run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gocyclo      # Kiểm tra độ phức tạp McCabe (Cyclomatic Complexity)
    - gocognit     # Kiểm tra độ phức tạp nhận thức (Cognitive Complexity)
    - cyclop       # Giới hạn độ phức tạp của hàm
    - funlen       # Giới hạn độ dài hàm (lines/statements)
    - goconst      # Phát hiện chuỗi lặp lại nên chuyển thành Hằng số (Constant)
    - nestif       # Kiểm tra mức độ lồng lặp của câu lệnh IF
  disable:
    - goanalysis_metalinter  # Bỏ qua sub-linter bị xung đột export data trên Jenkins

linters-settings:
  gocyclo:
    # Cảnh báo nếu độ phức tạp cyclomatic > 10
    min-complexity: 10

  gocognit:
    # Cảnh báo nếu độ phức tạp cognitive > 15
    min-complexity: 15

  cyclop:
    max-complexity: 10
    package-average: 5.0

  funlen:
    lines: 60        # Tối đa 60 dòng/hàm
    statements: 40   # Tối đa 40 câu lệnh/hàm

  nestif:
    # Cảnh báo nếu IF lồng nhau quá 3 tầng
    min-complexity: 3

  goconst:
    min-len: 3
    min-occurrences: 3

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0